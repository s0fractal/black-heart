name: Repository hygiene
on: [pull_request]
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Path checker controls and added source lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 tools/absolute_path_check.py --selftest
          python3 tools/absolute_path_check.py --base "$BASE"
      - name: Install pinned local-link checker
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/lychee.tar.gz"
          echo "1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a  $RUNNER_TEMP/lychee.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/lychee-bin"
          tar --strip-components=1 -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee-bin"
          echo "$RUNNER_TEMP/lychee-bin" >> "$GITHUB_PATH"
      - name: Local links in changed Markdown (external URLs are not checked)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only -z --diff-filter=ACMR "$BASE" HEAD -- '*.md' |
            xargs -0 -r lychee --offline --no-progress
