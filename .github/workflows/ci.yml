name: CI - Project Black-Heart

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        python-version: [ '3.11', '3.12', '3.13' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Zero External Dependencies
        run: |
          pip list
          python3 -c "import sys; print(f'Python {sys.version}')"

      - name: Run Unified Test Suite (30 Engines)
        run: |
          python3 test_all.py

  r2-external-anchor:
    name: R2 external-anchor reader (with OpenTimestamps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenTimestamps (isolated to this job)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "opentimestamps==0.4.5"

      - name: Run EXP-LIB-001 R2 reader tests (no skips expected)
        run: |
          python3 experiments/EXP-LIB-001/ci_r2_check.py
